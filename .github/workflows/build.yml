name: creche-ci-release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: v
        run: |
          git fetch --tags --force || true
          LAST_TAG=$(git tag -l "v*" | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.2.104"
          fi
          VERSION=${LAST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $NEW_VERSION"

  build-web:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Create .env file from GitHub Secrets
        run: |
          cat <<EOF > .env
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          EOF

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Package Web Release (ZIP)
        run: |
          mkdir -p release
          cd dist && zip -r ../release/creche-web.v${{ needs.version.outputs.version }}.zip ./* && cd ..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: release/creche-web.v${{ needs.version.outputs.version }}.zip
          retention-days: 30

  build-android:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode Android Release Keystore
        id: keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "keystore_available=true" >> $GITHUB_OUTPUT
          else
            echo "keystore_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Create .env & key properties
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

          if [ "${{ steps.keystore.outputs.keystore_available }}" = "true" ]; then
            cat <<EOF > android/key.properties
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyPassword=${{ secrets.KEY_PASSWORD }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            storeFile=release.keystore
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get || true

      - name: Build Signed APK
        run: |
          mkdir -p release
          flutter build apk --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=.env || true
          
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release/creche-android-release.v${{ needs.version.outputs.version }}.apk
          fi

      - name: Build Signed AAB (App Bundle)
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define-from-file=.env || true

          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab release/creche-android-release.v${{ needs.version.outputs.version }}.aab
          fi

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*
          retention-days: 30

  publish-release:
    needs: [version, build-web, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create Git Tag
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag v${{ needs.version.outputs.version }} || true
          git push origin v${{ needs.version.outputs.version }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with Signed APK, AAB & Web
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Crèche & Bear Baby v${{ needs.version.outputs.version }}
          body: |
            Release officielle de l'application **Crèche & Club Management (Bear Baby)** v${{ needs.version.outputs.version }}.
            
            ### 📦 Paquets & Téléchargements
            - 🌐 **Web**: `creche-web.v${{ needs.version.outputs.version }}.zip` (Application SPA optimisée pour hébergement)
            - 📱 **Android APK**: `creche-android-release.v${{ needs.version.outputs.version }}.apk` (Signé avec Keystore pour installation directe)
            - 📦 **Android AAB**: `creche-android-release.v${{ needs.version.outputs.version }}.aab` (Signé pour Google Play Store)
            
            ### 🔐 Sécurité & GitHub Secrets
            - Variables d'environnement et clés d'API Supabase injectées au build via GitHub Secrets
            - Keystore Android et mots de passe sécurisés (`KEYSTORE_BASE64`, `KEYSTORE_PASSWORD`, `KEY_ALIAS`, `KEY_PASSWORD`)
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
